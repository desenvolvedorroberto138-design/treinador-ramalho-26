<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin - Vinicius Ramalho</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="auth-screen" class="auth-screen">
        <div class="auth-box">
            <div class="auth-logo">VINICIUS RAMALHO</div>
            <h1>Painel Administrativo</h1>
            <p class="auth-subtitle">Digite a senha para acessar os leads</p>
            
            <form id="auth-form" class="auth-form">
                <div class="form-group">
                    <label for="admin-password">Senha</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="admin-password" 
                            name="password" 
                            placeholder="••••••••" 
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" id="toggle-password" class="toggle-password" aria-label="Mostrar/ocultar senha">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <p id="auth-error" class="auth-error" style="display: none;"></p>
                </div>
                <button type="submit" class="btn-primary btn-full" id="auth-submit">
                    <span class="btn-text">ACESSAR PAINEL</span>
                    <span class="btn-loader" style="display: none;">
                        <svg class="spinner" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="31.4 31.4" stroke-linecap="round"></circle>
                        </svg>
                    </span>
                </button>
            </form>
        </div>
    </div>

    <div id="admin-panel" class="admin-panel" style="display: none;">
        <header class="admin-header">
            <div class="admin-header-left">
                <h1>Leads</h1>
                <span id="lead-count" class="badge">0</span>
            </div>
            <div class="admin-header-right">
                <button id="btn-export" class="btn-secondary" title="Exportar CSV">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Exportar
                </button>
                <button id="btn-logout" class="btn-ghost" title="Sair">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
        </header>

        <div class="admin-toolbar">
            <div class="search-box">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-input" placeholder="Buscar por nome ou WhatsApp..." autocomplete="off">
            </div>
            <div class="filter-group">
                <select id="status-filter">
                    <option value="">Todos os status</option>
                    <option value="novo">🆕 Novo</option>
                    <option value="contatado">📞 Contatado</option>
                    <option value="convertido">✅ Convertido</option>
                    <option value="perdido">❌ Perdido</option>
                </select>
                <select id="date-filter">
                    <option value="">Todos os períodos</option>
                    <option value="today">Hoje</option>
                    <option value="week">Esta semana</option>
                    <option value="month">Este mês</option>
                    <option value="last-month">Mês passado</option>
                </select>
            </div>
        </div>

        <div class="table-wrapper">
            <table id="leads-table" class="leads-table">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>WhatsApp</th>
                        <th>Objetivo</th>
                        <th>Data</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="leads-tbody"></tbody>
            </table>
        </div>

        <div id="empty-state" class="empty-state" style="display: none;">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <h3>Nenhum lead encontrado</h3>
            <p>Ajuste os filtros ou aguarde novos cadastros</p>
        </div>

        <div class="pagination" id="pagination" style="display: none;">
            <button id="prev-page" class="btn-ghost" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <span id="page-info" class="page-info">Página 1 de 1</span>
            <button id="next-page" class="btn-ghost" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="config.js"></script>
    <script src="admin.js" type="module"></script>
</body>
</html>
